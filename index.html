<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vandana Charabudla | Data Engineer</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #0b111c;
  color: #f8fafc;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 7%;
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(11, 17, 28, 0.85);
  backdrop-filter: blur(10px);
  z-index: 100;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

nav a {
  color: #e5e7eb;
  text-decoration: none;
  margin-left: 28px;
  font-size: 14px;
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 20px 60px;
  background:
    radial-gradient(circle at center, rgba(56,189,248,0.18), transparent 30%),
    radial-gradient(circle at 60% 45%, rgba(147,51,234,0.25), transparent 25%),
    #0b111c;
}

.hero h1 {
  font-size: clamp(48px, 8vw, 96px);
  letter-spacing: 4px;
  font-weight: 800;
}

.hero p {
  margin-top: 18px;
  font-size: 15px;
  letter-spacing: 2px;
  color: #cbd5e1;
}

.hero .summary {
  max-width: 720px;
  margin: 28px auto;
  line-height: 1.8;
  letter-spacing: 0;
  font-size: 16px;
  color: #94a3b8;
}

.buttons a {
  display: inline-block;
  margin: 10px;
  padding: 13px 24px;
  border-radius: 30px;
  text-decoration: none;
  color: white;
  background: linear-gradient(135deg, #2563eb, #9333ea);
  font-weight: bold;
  font-size: 14px;
}

.buttons a.secondary {
  background: transparent;
  border: 1px solid #38bdf8;
}

section {
  padding: 70px 7%;
}

.section-title {
  font-size: 32px;
  margin-bottom: 30px;
  color: #38bdf8;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
}

.metric, .card {
  background: #111827;
  border: 1px solid #1f2937;
  border-radius: 18px;
  padding: 26px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.metric h3 {
  font-size: 36px;
  color: #38bdf8;
}

.metric p {
  color: #cbd5e1;
  margin-top: 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 22px;
}

.card h3 {
  margin-bottom: 10px;
  color: white;
}

.card p, li {
  color: #cbd5e1;
  line-height: 1.7;
}

.card ul {
  padding-left: 20px;
}

.tags span {
  display: inline-block;
  background: #1e293b;
  color: #38bdf8;
  padding: 8px 12px;
  border-radius: 20px;
  margin: 6px 5px 0 0;
  font-size: 13px;
}

.project-link {
  display: inline-block;
  margin-top: 16px;
  color: #38bdf8;
  text-decoration: none;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 35px;
  color: #94a3b8;
  border-top: 1px solid #1f2937;
}
